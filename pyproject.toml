[project]
name = "lexical-benchmark"
description = "A detailed comparison between human (CDI) and model performance at the lexical level"
authors = [
    { name = "Nicolas Hamilakis", email = "nicolas.hamilakis@ens.psl.eu" },
    { name = "Jing Liu", email = "jing.liu@ens.psl.eu" },
    { name = "CoML Team", email = "dev@cognitive-ml.fr" },
]
license = "MIT"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.12"
keywords = ["python"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "typing_extensions",
    "matplotlib",
    "seaborn",
    "pandas",
    "polars",
    "numpy",
    "polyglot",
    "nltk",
    "ipython",
    "rich",
    "scipy",
    "statsmodels",
    "num2words",
    "humanize",
    "psutil",
    "librosa",
    "openpyxl",
    "python-dateutil",
    "PyYAML",
    "pyarrow",
    "beautifulsoup4",
    "httpx",
    "clypi",
    "pydantic",
    "rtoml",
    "torch==2.5.1",
    "torchtyping>=0.1.5",
    "transformers==4.49.0",
    "accelerate==1.3.0",
    "tokenizers==0.21.0; sys_platform == 'linux' or sys_platform == 'linux2'",
    # Spacy CUDA should not be installed on macOS
    # This requires a cuda>12.1.1 to be available in the current env
    # Tested on cuda/12.4.1 on JZ it works
    # Failed on cuda/12.1.0
    # Worked on cuda/12.1.1 on Oberon (??)
    "spacy[cuda12x]; sys_platform == 'linux' or sys_platform == 'linux2'",
    "spacy; sys_platform == 'darwin'",
    "wandb",
    "datasets>=3.5.0",
    "joblib",
]

dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/nhamilakis/Lexical-benchmark/tree/dev/docs"
Repository = "https://github.com/nhamilakis/Lexical-benchmark"
Issues = "https://github.com/nhamilakis/Lexical-benchmark/issues"
Changelog = "https://github.com/nhamilakis/Lexical-benchmark/blob/dev/CHANGELOG.md"

[project.scripts]
download-stela = "lexical_benchmark.downloader:entrypoint"
gen-checkpoint = "lexical_benchmark.train.checkpoint_utils:check_point_explorer"
hf-download = "lexical_benchmark.train:hf_dl_cmd"
hf-dataset-builder = "lexical_benchmark.hf.build.__main__:entrypoint"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "jupyter",
    "pytest>=8.3.4",
    "pre-commit",
]
build = ["torch", "setuptools", "packaging"]
accelerate = [
    # VLLM installation fails on macos
    "vllm>=0.7.3; sys_platform == 'linux' or sys_platform == 'linux2'",
    # Requires CUDA to be available
    "flash-attn>=2.7.4.post1; sys_platform == 'linux' or sys_platform == 'linux2'",
]

[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lexical_benchmark*"]
exclude = ["examples*", "tests*",  "src/slurm_scripts*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools]
script-files = [ 
    # Build Scripts
    # Clean Scripts
    # Process Datasets
    # Compute Stuff
    # Train
    # Generate
    # Analysis
]

[tool.uv]
no-build-isolation-package = ["flash-attn"]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.7.4.post1"
requires-dist = ["torch", "einops"]

[tool.mypy]
exclude = [
    'parser\.py$' # Exclude parser.py -> sly does not type-check
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--ignore=src/scripts", "--ignore=notebooks", "--ignore=experiments", "--ignore=docs"]


[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    "parser.py",  # Exclude parser.py -> sly does not lint properly
    "notebooks", "*ipynb", # Notebooks should be ignored
    "*.pyi", 
    ".venv", 
    "src/lexical_benchmark/legacy", # Legacy code gets a pass for now (warning is thrown when importing)
    "src/lexical_benchmark/processing/turn_taking.py", # TODO: work-in-progress
    "src/scripts/archived/",  # ignore archived scripts for now
    "src/scripts/debug/",
    "src/slurm_scripts/",
]
force-exclude = true


[tool.ruff.lint]
select = ["ALL"] # Be brave use all rules
fixable = ["ALL"]
unfixable = []
# remove the ones that make no sense
ignore = [
    "S301",    # Pickling is safe in our context
    "ARG001",  # No need to type kwargs as they are dynamicly set.
    "NPY002",  # Allow numpy unsafe generations
    "S105",    # ignore hardcoded stuff
    "S107",    # falsely detects hardcoded passwords in code
    "ANN401",  # allow the t.Any type to be used
    "D100",    # allow top doc-string to be missing
    "D401",    # imperative mood in docstring is ambiguous
    "D203", "D213", # Conflicting rules about docstrings
    "S324",    # allow md5, as this is a non critical usage
    "DTZ005", "DTZ011",  # no need for timezones in datetimes
    "S603",    # allow subprocess to be called using literals
    "PLR0913", # allow functions to have more tha 12 arguments
    "TRY003",  # allow Exceptions to contain long messages
    "EM101",   # allow Exceptions to contain literals
    "ANN002", "ANN003",  # allow *args & **kwargs to be without type-hints
    "D107", "D105", # allow __init__  and all python __magic__ functions to be without a docstring
    "ANN001",  # "self" & "cls" need no typing (rule is Deprecated)
    "T201", "T203",    # allow 'print' & 'pprint' statements
    "FIX002", "TD002", "TD003",  # allow todos + todos without issue + todos without author
    "D104",    # allow scripts not to have docstring on top
    "EM102",   # allow exception to use f-strings
    "S311",    # No cryptography done here random is safe enough
    "PD901",   # Allow df variable name
    "COM812",  # Allow trailing comma to be missing
    "G004",    # Allow f-strings in logger (reasonable, but not here)
    "PLR2004", # Allow magic numbers (should be avoided, except some math contexts)
    "TRY301",  # Allow raise inside a try/except clause.
]


[tool.ruff.lint.flake8-import-conventions.aliases]
typing = "t"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",    # Allow assert in test files
    "ANN201",  # Test functions do not need a return type
    "D103",    # Docstring can be redundant in test functions
]
"**/archive/**" = [
    "ALL"
]

[tool.setuptools_scm]
fallback_version = "0.0.0-dev"
