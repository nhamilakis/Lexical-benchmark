[project]
name = "lexical-benchmark"
description = "A detailed comparison between human (CDI) and model performance at the lexical level"
authors = [
    { name = "Nicolas Hamilakis", email = "nicolas.hamilakis@ens.psl.eu" },
    { name = "CoML Team", email = "dev@cognitive-ml.fr" },
    { name = "Jing Liu", email = "jing.liu@student.ru.nl" },
]
license = { text = "MIT License" }
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.12"
keywords = ["python"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Development Status :: 4 - Beta",
]
dynamic = ["dependencies", "version"]

[project.urls]
documentation = "https://github.com/Jing-L97/Lexical-benchmark"
repository = "https://github.com/Jing-L97/Lexical-benchmark"


[project.optional-dependencies]
dev = ["ruff", "mypy", "ipython", "jupyter", "pytest>=8.3.4",]
# polyglot = ["polyglot", "pyicu", "pycld2", "morfessor"]
asr = ["openai-whisper"]
# This requires a cuda>12.1.1 to be available in the current env
# Tested on cuda/12.4.1 on JZ it works
# Failed on cuda/12.1.0
# Worked on cuda/12.1.1 on Oberon (??)
optimised = [
    "polars",
    "torch==2.5.1; sys_platform == 'linux' or sys_platform == 'linux2'",
    "spacy[cuda12x]; sys_platform == 'linux' or sys_platform == 'linux2'",
    "spacy; sys_platform == 'darwin'",
]
train = [
    "accelerate==1.3.0",
    "tokenizers==0.21.0",
    "torch==2.5.1; sys_platform == 'linux' or sys_platform == 'linux2'",
    "torchtyping==0.1.4; sys_platform == 'linux' or sys_platform == 'linux2'",
    "vllm==0.6.6; sys_platform == 'linux' or sys_platform == 'linux2'",
    "transformers==4.48.0; sys_platform == 'linux' or sys_platform == 'linux2'",
    "wandb",
]

# Dependency groups not yet supported as optionals
[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "ipython",
    "jupyter",
    "pytest>=8.3.4",
]
# polyglot = ["polyglot", "pyicu", "pycld2", "morfessor"]
asr = ["openai-whisper"]
# This requires a cuda>12.1.1 to be available in the current env
# Tested on cuda/12.4.1 on JZ it works
# Failed on cuda/12.1.0
# Worked on cuda/12.1.1 on Oberon (??)
optimised = [
    "polars",
    "torch==2.5.1; sys_platform == 'linux' or sys_platform == 'linux2'",
    "spacy[cuda12x]; sys_platform == 'linux' or sys_platform == 'linux2'",
    "spacy; sys_platform == 'darwin'",
]
train = [
    "accelerate==1.3.0",
    "tokenizers==0.21.0",
    "torch==2.5.1; sys_platform == 'linux' or sys_platform == 'linux2'",
    "torchtyping==0.1.4; sys_platform == 'linux' or sys_platform == 'linux2'",
    "transformers==4.48.0",
    "wandb",
    "vllm==0.6.6",
]

[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]
include = ["lexical_benchmark*"]
exclude = ["examples*", "tests*", "src/scripts*", "scripts*", "experiments*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools]
script-files = [ 
    # Build Scripts
    "src/scripts/build_preprocess/lm_build_childes.py",
    "src/scripts/build_preprocess/lm_build_stela.py",
    # Clean Scripts
    "src/scripts/clean_text/lm_clean_childes.py",
    "src/scripts/clean_text/lm_clean_stela.py"
    # Process Datasets
    # Compute Stuff
    # Train
    # Generate
    # Analysis
]

[tool.mypy]
exclude = [
    'parser\.py$' # Exclude parser.py -> sly does not type-check
]
[tool.uv]
default-groups = ["train", "optimised"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--ignore=src/scripts", "--ignore=notebooks", "--ignore=experiments", "--ignore=docs"]


[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["parser.py", "*.pyi"] # Exclude parser.py -> sly does not lint proper


[tool.ruff.lint]
select = ["ALL"] # Be brave use all rules
fixable = ["ALL"]
unfixable = []
# remove the ones that make no sense
ignore = [
    "ARG001",  # No need to type kwargs as they are dynamicly set.
    "NPY002",  # Allow numpy unsafe generations
    "S105",    # ignore hardcoded stuff
    "S107",    # falsely detects hardcoded passwords in code
    "ANN401",  # allow the t.Any type to be used
    "D100",    # allow top doc-string to be missing
    "D401",    # imperative mood in docstring is ambiguous
    "D203", "D213", # Conflicting rules about docstrings
    "S324",    # allow md5, as this is a non critical usage
    "DTZ005", "DTZ011",  # no need for timezones in datetimes
    "S603",    # allow subprocess to be called using literals
    "PLR0913", # allow functions to have more tha 12 arguments
    "TRY003",  # allow Exceptions to contain long messages
    "EM101",   # allow Exceptions to contain literals
    "ANN003",  # allow **kwargs to be without type-hints
    "D107", "D105", # allow __init__  and all python __magic__ functions to be without a docstring
    "ANN101", "ANN102", "ANN001",  # "self" & "cls" need no typing (rule is Deprecated)
    "T201", "T203",    # allow 'print' & 'pprint' statements
    "FIX002", "TD002", "TD003",  # allow todos + todos without issue + todos without author
    "D104",    # allow scripts not to have docstring on top
    "EM102",   # allow exception to use f-strings
    "S311",    # No cryptography done here random is safe enough
    "PD901",   # Allow df variable name
    "COM812",  # Allow trailing comma to be missing
    "G004",    # Allow f-strings in logger (reasonable, but not here)
    "PLR2004", # Allow magic numbers (should be avoided, except some math contexts)
]


[tool.ruff.lint.flake8-import-conventions.aliases]
typing = "t"

[tool.ruff.per-file-ignores]
"**/tests/**" = [
    "S101",    # Allow assert in test files
    "ANN201",  # Test functions do not need a return type
    "D103",    # Docstring can be redundant in test functions
]

[tool.setuptools_scm]
fallback_version = "0.0.0-dev"
